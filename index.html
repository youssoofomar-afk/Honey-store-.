<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أولاد الفلاح - عسل نحل طبيعي</title>
<meta name="description" content="أولاد الفلاح - عسل نحل طبيعي 100%: موالح، برسيم، قطن، موز">
<style>
  :root { --honey:#e8a317; --dark:#4a3000; --bg:#fff8e6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Tahoma, Arial, sans-serif; background:var(--bg); color:var(--dark); }
  header { background:linear-gradient(135deg,#f5b82e,#e8a317); padding:40px 20px; text-align:center; color:#fff; }
  header h1 { font-size:2.4rem; }
  header p { margin-top:8px; font-size:1.1rem; }
  .contact { margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .contact a { background:#fff; color:var(--dark); text-decoration:none; padding:10px 16px;
               border-radius:25px; font-weight:bold; }
  .contact a.wa { background:#25d366; color:#fff; }
  main { max-width:1000px; margin:30px auto; padding:0 16px; }
  h2 { margin:28px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .card img, .card .ph { width:100%; height:200px; object-fit:cover; display:block; }
  .card .ph { background:#fdeabb; display:flex; align-items:center; justify-content:center; font-size:4rem; }
  .card .body { padding:14px; }
  .price { color:var(--honey); font-weight:bold; margin:10px 0; font-size:1.1rem; }
  button { background:var(--honey); color:#fff; border:0; padding:10px 16px;
           border-radius:8px; cursor:pointer; font-size:1rem; font-family:inherit; }
  button:hover { opacity:.85; }
  button.wa { background:#25d366; width:100%; margin-top:6px; }
  .cart, form { background:#fff; border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  input, select { width:100%; padding:10px; margin:6px 0 12px; border:1px solid #ccc; border-radius:8px;
                  font-size:1rem; font-family:inherit; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee; }
  .qty button { padding:2px 10px; }
  #msg { margin-top:10px; font-weight:bold; }
  footer { text-align:center; padding:24px; margin-top:30px; background:var(--dark); color:#fff; }
</style>
</head>
<body>

<header>
  <h1>🍯 أولاد الفلاح</h1>
  <p>عسل نحل طبيعي 100% من المناحل إلى بيتك</p>
  <div class="contact">
    <a href="tel:01017767507">📞 01017767507</a>
    <a href="tel:01094780955">📞 01094780955</a>
    <a class="wa" href="https://wa.me/201017767507" target="_blank" rel="noopener">واتساب 1</a>
    <a class="wa" href="https://wa.me/201094780955" target="_blank" rel="noopener">واتساب 2</a>
  </div>
</header>

<main>
  <h2>منتجاتنا</h2>
  <div class="grid" id="products"></div>

  <h2>سلة الطلبات</h2>
  <div class="cart" id="cart">السلة فارغة</div>

  <h2>إتمام الطلب</h2>
  <form id="orderForm">
    <label>الاسم</label>
    <input id="name" required maxlength="80">
    <label>العنوان</label>
    <input id="address" required maxlength="200">
    <label>إرسال الطلب إلى</label>
    <select id="shopPhone">
      <option value="201017767507">واتساب 01017767507</option>
      <option value="201094780955">واتساب 01094780955</option>
    </select>
    <button type="submit" class="wa">إرسال الطلب عبر واتساب 💬</button>
    <div id="msg"></div>
  </form>
</main>

<footer>
  <p>© أولاد الفلاح - جميع الحقوق محفوظة</p>
  <p style="margin-top:8px">للتواصل: 01017767507 - 01094780955</p>
</footer>

<script>
/* =====================================================================
   ✏️ عدّل المنتجات والأسعار من هنا:
   - name: اسم المنتج
   - description: الوصف
   - price: السعر (رقم فقط)
   - unit: الوحدة (كيلو / علبة ...)
   - image: مسار الصورة داخل مجلد images (الاسم لازم يطابق اسم الملف بالظبط)
   لإضافة منتج: انسخ سطراً كاملاً وغيّر بياناته وغيّر رقم id.
   لحذف منتج: امسح سطره.
   ===================================================================== */
const PRODUCTS = [
  { id: 1, name: "عسل موالح", description: "عسل زهور الحمضيات برائحة مميزة", price: 280, unit: "كيلو", image: "images/mawalih.jpg" },
  { id: 2, name: "عسل برسيم", description: "عسل برسيم خفيف الطعم ومناسب للأطفال", price: 250, unit: "كيلو", image: "images/bersim.jpg" },
  { id: 3, name: "عسل قطن", description: "عسل زهرة القطن طبيعي 100%", price: 260, unit: "كيلو", image: "images/qotn.jpg" },
  { id: 4, name: "عسل موز", description: "عسل زهرة الموز بطعم مميز", price: 300, unit: "كيلو", image: "images/moz.jpg" }
];

/* ===================== من هنا لا تعدّل ===================== */
let cart = {};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderProducts() {
  const box = document.getElementById('products');
  if (!PRODUCTS.length) { box.textContent = 'لا توجد منتجات حالياً'; return; }
  box.innerHTML = PRODUCTS.map(p => `
    <div class="card">
      ${p.image
        ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"
                onerror="this.outerHTML='<div class=&quot;ph&quot;>🍯</div>'">`
        : '<div class="ph">🍯</div>'}
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.description)}</p>
        <div class="price">${esc(p.price)} ج.م / ${esc(p.unit)}</div>
        <button onclick="addToCart(${p.id})">أضف للسلة</button>
      </div>
    </div>`).join('');
}

function addToCart(id) { cart[id] = (cart[id] || 0) + 1; renderCart(); }

function changeQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}

function cartTotal() {
  return Object.keys(cart).reduce((t, id) => {
    const p = PRODUCTS.find(x => x.id == id);
    return p ? t + p.price * cart[id] : t;
  }, 0);
}

function renderCart() {
  const ids = Object.keys(cart).filter(id => PRODUCTS.some(x => x.id == id));
  const el = document.getElementById('cart');
  if (!ids.length) { el.textContent = 'السلة فارغة'; return; }
  el.innerHTML = ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id);
    return `<div class="row"><span>${esc(p.name)}</span>
      <span class="qty"><button onclick="changeQty(${id},-1)">-</button>
      ${cart[id]}
      <button onclick="changeQty(${id},1)">+</button></span>
      <span>${p.price * cart[id]} ج.م</span></div>`;
  }).join('') + `<div class="row"><b>الإجمالي</b><b>${cartTotal()} ج.م</b></div>`;
}

document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const ids = Object.keys(cart).filter(id => PRODUCTS.some(x => x.id == id));
  if (!ids.length) { msg.textContent = 'أضف منتجاً للسلة أولاً'; return; }

  const lines = ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id);
    return `- ${p.name} × ${cart[id]} = ${p.price * cart[id]} ج.م`;
  });
  const text =
    `طلب جديد من موقع أولاد الفلاح 🍯\n\n` +
    `الاسم: ${document.getElementById('name').value}\n` +
    `العنوان: ${document.getElementById('address').value}\n\n` +
    `الطلب:\n${lines.join('\n')}\n\n` +
    `الإجمالي: ${cartTotal()} ج.م`;

  const phone = document.getElementById('shopPhone').value;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
  msg.textContent = 'تم فتح واتساب، اضغط إرسال لتأكيد طلبك ✔';
});

renderProducts();
</script>
</body>
</html>
